<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#16100c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CC Admin">
<title>CC Admin · Code Caffeine</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
@font-face { font-family: "Inter Tight"; src: url("/assets/fonts/inter-tight.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Inter"; src: url("/assets/fonts/inter.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
:root {
  color-scheme: dark;
  --bg: #16100c; --bg2: #1f1611; --ink: #f5ecdf; --ink2: rgba(245, 236, 223, .7); --ink3: rgba(245, 236, 223, .48);
  --line: rgba(255, 255, 255, .09); --line2: rgba(255, 255, 255, .16);
  --btn: #f3e9da; --btn-ink: #1a100a; --soft: rgba(255, 255, 255, .07);
  /* tiga warna status: belum, diproses, selesai */
  --c-baru: #f2b46c; --c-proses: #82b4ee; --c-selesai: #7ddc8e; --c-batal: #a99a8c;
  --off: #e27d6a; --focus: #f2b46c;
  --f-head: "Inter Tight", "Inter", system-ui, sans-serif; --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #f4ede4; --bg2: #fbf7f1; --ink: #20140d; --ink2: #6b5849; --ink3: #978373;
    --line: rgba(40, 24, 14, .1); --line2: rgba(40, 24, 14, .18);
    --btn: #24160e; --btn-ink: #f7efe4; --soft: rgba(40, 24, 14, .06);
    --c-baru: #b8661a; --c-proses: #2c69b0; --c-selesai: #2b8546; --c-batal: #8e7d6f;
    --off: #b2442f; --focus: #b86a1e;
  }
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); -webkit-font-smoothing: antialiased;
  padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0); }
h1, h2, h3, p { margin: 0; }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
main { max-width: 680px; margin: 0 auto; padding: 18px 14px 60px; }

/* kepala */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.top h1 { font: 700 24px/1.2 var(--f-head); }
.top .btn { min-height: 34px; font-size: 13px; padding: 0 14px; }
.upd { color: var(--ink3); font-size: 12.5px; margin-top: 2px; }

/* tiga angka */
.counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.cnt { --c: var(--c-baru); display: block; text-decoration: none; padding: 10px 12px; border-radius: 14px;
  background: color-mix(in srgb, var(--c) 14%, var(--bg)); border: 1px solid color-mix(in srgb, var(--c) 38%, transparent); }
.cnt b { display: block; font: 700 24px/1.1 var(--f-head); color: var(--c); }
.cnt span { font-size: 13px; color: var(--ink2); font-weight: 600; }
.cnt.proses { --c: var(--c-proses); } .cnt.selesai { --c: var(--c-selesai); }
.omzet { margin-top: 8px; color: var(--ink2); font-size: 13.5px; }
.omzet b { color: var(--ink); }

/* panel penting (notifikasi belum aktif, pasang aplikasi) */
.panel { margin-top: 12px; padding: 12px 14px; border: 1px solid var(--line2); border-radius: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.panel p { color: var(--ink2); font-size: 14px; flex: 1 1 220px; }
.panel p b { color: var(--ink); }
.panel ol { margin: 6px 0 0; padding-left: 20px; }

.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid transparent; background: var(--btn); color: var(--btn-ink); font-weight: 600; font-size: 14px; text-decoration: none; white-space: nowrap; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line2); }
.btn.warn { background: transparent; color: var(--off); border-color: color-mix(in srgb, var(--off) 45%, transparent); }
.btn.sm { min-height: 32px; padding: 0 12px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }

.tools { display: flex; gap: 8px; margin-top: 14px; }
.tools input { flex: 1; min-width: 0; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line2); background: var(--soft); }
.tools select { height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line2); background: var(--soft); max-width: 46%; }

/* kelompok berwarna */
.grp { --c: var(--c-baru); margin-top: 18px; border-radius: 18px; overflow: hidden;
  border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); background: color-mix(in srgb, var(--c) 5%, var(--bg)); scroll-margin-top: 12px; }
.grp.proses { --c: var(--c-proses); } .grp.selesai { --c: var(--c-selesai); } .grp.batal { --c: var(--c-batal); }
.grp-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 14px;
  background: color-mix(in srgb, var(--c) 18%, var(--bg)); border-bottom: 1px solid color-mix(in srgb, var(--c) 30%, transparent); }
.grp-h h2 { font: 700 16px/1.2 var(--f-head); display: flex; align-items: center; gap: 8px; color: var(--ink); }
.grp-h h2 .n { min-width: 24px; height: 24px; padding: 0 7px; border-radius: 999px; background: var(--c); color: var(--bg); font: 700 13px/24px var(--f-body); text-align: center; }
.grp-h .btn { min-height: 30px; padding: 0 12px; font-size: 12.5px; }
.rekap { padding: 10px 14px; font-size: 13.5px; font-weight: 600; border-bottom: 1px solid var(--line); }
.kosong { padding: 14px; color: var(--ink3); font-size: 14px; }
.lihat-batal { display: block; width: 100%; margin-top: 14px; padding: 10px; border: 1px dashed var(--line2); border-radius: 14px; background: none; color: var(--ink2); font-size: 14px; }

/* baris pesanan: ketuk untuk melihat detail */
.ord + .ord { border-top: 1px solid var(--line); }
.ord.baru { animation: kilat 2.4s ease-out; }
@keyframes kilat { 0% { background: color-mix(in srgb, var(--c) 30%, transparent); } 100% { background: transparent; } }
.ring { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 14px; border: 0; background: none; text-align: left; }
.ring .nm { font: 650 16px/1.3 var(--f-head); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ring .tot { font-weight: 650; text-align: right; }
.ring .isi { color: var(--ink2); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ring .chev { color: var(--ink3); font-size: 13px; text-align: right; transition: transform .15s; }
.ord.buka .chev { transform: rotate(180deg); }
.ring .chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.chip { padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 650; background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--c); }
.chip.tag { background: var(--soft); color: var(--ink2); }
.chip.utang { --c: var(--c-baru); }
.chip.ok { --c: var(--c-selesai); }
.chip.bahaya { --c: var(--off); }

.det { padding: 0 14px 14px; }
.det dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; font-size: 14px; }
.det dt { color: var(--ink3); }
.det dd { margin: 0; overflow-wrap: anywhere; }
.det .hint { margin-top: 10px; font-size: 13.5px; color: var(--ink2); }
.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.conf { margin-top: 12px; padding: 12px; border-radius: 12px; background: var(--soft); }
.conf p { font-size: 14px; }
.conf input { width: 100%; margin-top: 8px; height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line2); background: var(--bg2); }
.riw { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line2); font-size: 12.5px; color: var(--ink3); }
.riw p + p { margin-top: 2px; }
.riw a { color: var(--ink2); }

.foot { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--ink3); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.foot button { background: none; border: 0; padding: 0; color: var(--ink2); text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }

.gate { max-width: 440px; margin: 12vh auto 0; padding: 0 20px; }
.gate h1 { font: 700 24px/1.2 var(--f-head); }
.gate p { color: var(--ink2); margin-top: 10px; }
.gate form { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
.gate input { height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line2); background: var(--soft); }
.gate .err { color: var(--off); font-size: 14px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20; max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 14px; background: var(--btn); color: var(--btn-ink); font-weight: 600; font-size: 14px; box-shadow: 0 12px 30px rgba(0, 0, 0, .3); }
@media (prefers-reduced-motion: reduce) { .ord.baru { animation: none; } .ring .chev { transition: none; } }
</style>
</head>
<body>

<div class="gate" data-gate hidden>
  <h1>CC Admin</h1>
  <p data-gate-text>Halaman ini hanya bisa dibuka dengan link admin pribadimu. Buka link yang dibagikan, atau tempel di sini.</p>
  <form data-gate-form>
    <input name="link" type="url" inputmode="url" autocomplete="off" placeholder="https://…/admin/#k=…" aria-label="Link admin" required>
    <p class="err" data-gate-err hidden></p>
    <button class="btn" type="submit">Masuk</button>
  </form>
</div>

<main data-app hidden>
  <header class="top">
    <div><h1>Pesanan</h1><p class="upd" data-upd></p></div>
    <button class="btn ghost" type="button" data-refresh>Perbarui</button>
  </header>

  <nav class="counts" aria-label="Ringkasan">
    <a class="cnt baru" href="#g-baru"><b class="num" data-n="baru">0</b><span>Belum diproses</span></a>
    <a class="cnt proses" href="#g-proses"><b class="num" data-n="proses">0</b><span>Diproses</span></a>
    <a class="cnt selesai" href="#g-selesai"><b class="num" data-n="selesai">0</b><span>Selesai</span></a>
  </nav>
  <p class="omzet">Sudah dibayar: <b class="num" data-omzet>Rp0</b></p>

  <section class="panel" data-install hidden>
    <p><b>Pasang sebagai aplikasi</b> supaya CC Admin ada di layar utama.</p>
    <button class="btn" type="button" data-install-btn>Pasang aplikasi</button>
  </section>
  <section class="panel" data-notif hidden>
    <p data-notif-text></p>
    <button class="btn" type="button" data-notif-on hidden>Aktifkan notifikasi</button>
  </section>

  <div class="tools">
    <input type="search" placeholder="Cari nama, nomor WA, atau kode" aria-label="Cari pesanan" data-q>
    <select aria-label="Hari jual" data-hari></select>
  </div>

  <div data-list></div>

  <footer class="foot">
    <span>Masuk sebagai <b data-who></b></span>
    <span data-notif-foot hidden>Notifikasi aktif · <button type="button" data-notif-test>Tes notifikasi</button></span>
    <button type="button" data-logout>Keluar</button>
  </footer>
</main>

<div class="toast" role="status" aria-live="polite" data-toast hidden></div>

<script>
(function () {
  'use strict';
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rupiah = n => 'Rp' + Number(n || 0).toLocaleString('id-ID');
  const waIntl = wa => '62' + String(wa || '').replace(/^0/, '');
  const K_KEY = 'cc-admin-key';

  /* ---------- kunci dari link ---------- */
  function keyFrom(str) {
    try { const u = new URL(str, location.origin); return new URLSearchParams(u.hash.slice(1)).get('k') || u.searchParams.get('k') || ''; }
    catch (e) { return ''; }
  }
  let key = keyFrom(location.href);
  if (key) { try { localStorage.setItem(K_KEY, key); } catch (e) { /* mode privat */ } history.replaceState(null, '', '/admin/'); }
  else { try { key = localStorage.getItem(K_KEY) || ''; } catch (e) { key = ''; } }

  const gate = $('[data-gate]'), app = $('[data-app]');
  function showGate(msg) {
    app.hidden = true; gate.hidden = false;
    if (msg) { $('[data-gate-err]').textContent = msg; $('[data-gate-err]').hidden = false; }
  }
  function masuk(k) {
    key = k;
    try { localStorage.setItem(K_KEY, key); } catch (e) { /* abaikan */ }
    load(true); startTimer();
  }
  $('[data-gate-form]').addEventListener('submit', e => {
    e.preventDefault();
    const k = keyFrom(e.target.link.value.trim());
    if (!k) { $('[data-gate-err]').textContent = 'Link ini tidak berisi kunci admin. Salin ulang link lengkapnya.'; $('[data-gate-err]').hidden = false; return; }
    masuk(k);
  });
  addEventListener('hashchange', () => { const k = keyFrom(location.href); if (!k) return; history.replaceState(null, '', '/admin/'); masuk(k); });
  $('[data-logout]').addEventListener('click', () => {
    try { localStorage.removeItem(K_KEY); } catch (e) { /* abaikan */ }
    key = ''; clearInterval(timer); showGate();
    $('[data-gate-text]').textContent = 'Kamu sudah keluar dari HP ini. Buka lagi link admin pribadimu untuk masuk.';
  });

  async function api(path, data) {
    const opt = { headers: { 'x-admin-key': key }, cache: 'no-store' };
    if (data) { opt.method = 'POST'; opt.headers['content-type'] = 'application/json'; opt.body = JSON.stringify(data); }
    let res;
    try { res = await fetch('/api/admin/' + path + (data ? '' : (path.includes('?') ? '&' : '?') + 't=' + Date.now()), opt); }
    catch (e) { throw new Error('Koneksi bermasalah. Coba lagi.'); }
    let j = {}; try { j = await res.json(); } catch (e) { /* bukan JSON */ }
    if (!res.ok) { const err = new Error(j.error || 'Terjadi kesalahan.'); err.status = res.status; throw err; }
    return j;
  }

  /* ---------- status pesanan ---------- */
  // Tiga kelompok: belum diproses (oranye), diproses (biru), selesai (hijau). Batal disembunyikan di bawah.
  let all = [], admin = '', vapid = '', pembayaran = [], timer = 0, firstLoad = true, lastOk = 0, sig = '';
  let seenTindak = new Set();
  const expanded = new Set();             // baris yang sedang dibuka (tetap terbuka walau data diperbarui)
  const open = { key: '', aksi: '' };     // konfirmasi yang sedang terbuka
  const busy = new Set();
  let showBatal = false;
  const keyOf = p => p.jenis + ':' + p.id;
  const isWeb = p => p.jenis === 'web';
  const st = p => p.status || 'baru';
  const hari = p => (isWeb(p) ? p.untuk_hari : p.untuk) || 'Tanpa tanggal';
  const nominal = p => isWeb(p) ? p.total : p.harga;
  const kelompok = p => {
    if (st(p) === 'batal') return 'batal';
    if (p.diantar) return 'selesai';
    if (isWeb(p)) return st(p) === 'baru' ? 'baru' : 'proses';
    return ['menunggu_bayar', 'cek_admin'].includes(p.status) ? 'baru' : 'proses';
  };
  const perluTindak = p => (isWeb(p) && st(p) === 'baru') || (!isWeb(p) && p.status === 'cek_admin');
  const sudahBayar = p => isWeb(p) ? p.lunas && st(p) !== 'batal' : ['lunas', 'main', 'selesai'].includes(p.status);
  const GRUP = [
    { id: 'baru', title: 'Belum diproses', urut: 'lama' },
    { id: 'proses', title: 'Diproses', urut: 'lama', salin: true },
    { id: 'selesai', title: 'Selesai', urut: 'baru' },
    { id: 'batal', title: 'Batal', urut: 'baru' }
  ];

  function chips(p) {
    const c = [];
    if (!isWeb(p)) c.push('<span class="chip tag">Challenge</span>');
    const g = kelompok(p);
    if (isWeb(p)) {
      if (g === 'baru') c.push('<span class="chip">Baru</span>');
      if (g === 'proses' || g === 'selesai') c.push(p.lunas ? '<span class="chip ok">Lunas</span>' : `<span class="chip utang">Belum bayar · ${esc(p.bayar || '')}</span>`);
    } else {
      const t = { menunggu_bayar: 'Menunggu transfer', cek_admin: 'Cek transfer', lunas: 'Lunas · belum main', main: 'Sedang main', selesai: p.tier === 'large' ? 'Hasil: Large' : 'Hasil: Medium' }[p.status];
      if (t && g !== 'selesai') c.push(`<span class="chip${p.status === 'cek_admin' ? '' : ''}">${t}</span>`);
      if (p.curiga) c.push('<span class="chip bahaya">Skor perlu dicek</span>');
    }
    if (g === 'selesai') c.push('<span class="chip">Diantar</span>');
    if (g === 'batal') c.push('<span class="chip">Batal</span>');
    return c.join('');
  }

  /* ---------- tombol aksi ---------- */
  const A_CH = {
    lunas: { label: 'Tandai lunas', cls: '', tanya: p => `Sudah cek DANA dan ada uang masuk ${rupiah(p.harga)} dari ${p.nama}? Tantangan langsung terbuka di HP pembeli.`, ya: 'Ya, sudah masuk', ok: 'ditandai lunas' },
    batal: { label: 'Batalkan', cls: 'warn', tanya: p => `Batalkan pesanan ${p.kode}? Pembeli akan melihat alasannya.`, ya: 'Ya, batalkan', alasan: true, ok: 'dibatalkan' },
    belum_lunas: { label: 'Kembalikan ke belum lunas', cls: 'ghost', tanya: () => 'Kembalikan ke "cek transfer"? Tantangan di HP pembeli terkunci lagi.', ya: 'Ya, kembalikan', ok: 'dikembalikan ke cek transfer' },
    diantar: { label: 'Tandai diantar', cls: '', tanya: p => `${p.nama} sudah menerima minumannya?`, ya: 'Ya, sudah diantar', ok: 'ditandai diantar' },
    belum_diantar: { label: 'Belum diantar', cls: 'ghost', ok: 'dikembalikan ke diproses' }
  };
  const A_WEB = {
    terima: { label: 'Terima pesanan', cls: '', ok: 'diterima' },
    lunas: { label: 'Tandai lunas', cls: '', tanya: p => p.bayar === 'Tunai' ? `Uang tunai ${rupiah(p.total)} dari ${p.nama} sudah diterima?` : `Sudah cek dan ada transfer masuk ${rupiah(p.total)} dari ${p.nama}?`, ya: 'Ya, lunas', ok: 'ditandai lunas' },
    belum_lunas: { label: 'Belum lunas', cls: 'ghost', tanya: () => 'Tandai pesanan ini belum lunas lagi?', ya: 'Ya, belum lunas', ok: 'ditandai belum lunas' },
    diantar: { label: 'Tandai diantar', cls: '', tanya: p => `${p.nama} sudah menerima pesanannya?${p.lunas ? '' : ' Pembayarannya masih tercatat belum lunas.'}`, ya: 'Ya, sudah diantar', ok: 'ditandai diantar' },
    belum_diantar: { label: 'Belum diantar', cls: 'ghost', ok: 'dikembalikan ke diproses' },
    batal: { label: 'Batalkan', cls: 'warn', tanya: p => `Batalkan pesanan ${p.kode} atas nama ${p.nama}?`, ya: 'Ya, batalkan', alasan: true, ok: 'dibatalkan' },
    aktifkan: { label: 'Aktifkan lagi', cls: 'ghost', ok: 'diaktifkan lagi' }
  };
  const actsOf = p => isWeb(p) ? A_WEB : A_CH;
  function actionsFor(p) {
    if (isWeb(p)) {
      const s = st(p);
      if (s === 'baru') return ['terima', 'batal'];
      if (s === 'batal') return ['aktifkan'];
      if (p.diantar) return [p.lunas ? null : 'lunas', 'belum_diantar'].filter(Boolean);
      return [p.lunas ? null : 'lunas', 'diantar', p.lunas ? 'belum_lunas' : null, 'batal'].filter(Boolean);
    }
    if (p.status === 'cek_admin' || p.status === 'menunggu_bayar') return ['lunas', 'batal'];
    if (p.status === 'lunas') return p.diantar ? ['belum_diantar'] : ['diantar', 'belum_lunas', 'batal'];
    if (p.status === 'main' || p.status === 'selesai') return p.diantar ? ['belum_diantar'] : ['diantar'];
    return [];
  }
  function petunjuk(p) {
    if (isWeb(p) && st(p) === 'baru') return 'Balas pembeli lewat tombol WA pembeli, lalu tekan Terima pesanan.';
    if (!isWeb(p) && p.status === 'cek_admin') return 'Pembeli bilang sudah transfer. Cek DANA dulu, baru tandai lunas.';
    if (!isWeb(p) && p.status === 'menunggu_bayar') return 'Pembeli belum menekan "sudah transfer". Batal otomatis setelah 1 jam.';
    if (!isWeb(p) && p.status === 'lunas' && !p.diantar) return 'Buat Medium dulu; ukuran akhirnya menunggu hasil game.';
    return '';
  }

  const fmtJam = new Intl.DateTimeFormat('id-ID', { timeZone: 'Asia/Jakarta', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  const jamSaja = new Intl.DateTimeFormat('id-ID', { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit' });
  const waktu = iso => iso ? fmtJam.format(new Date(iso)) : '';
  function infoBayar() { const b = pembayaran[0]; return b ? `${b.jenis} ${b.nomor}${b.atasNama ? ' a.n. ' + b.atasNama : ''}` : ''; }
  function waBuyer(p) {
    let t;
    if (isWeb(p)) {
      const terima = p.cara_terima === 'Diantar' ? `diantar ke ${p.lokasi}` : String(p.lokasi).replace(/^Ambil/, 'ambil');
      const bayar = p.lunas ? ' Pembayaran sudah kami terima.'
        : p.bayar === 'Transfer' ? ` Silakan transfer ${rupiah(p.total)}${infoBayar() ? ' ke ' + infoBayar() : ''}, lalu kirim buktinya di chat ini ya.`
        : ' Bayarnya tunai saat serah terima ya.';
      t = st(p) === 'batal' ? `Halo ${p.nama}, ini admin Code Caffeine soal pesanan ${p.kode}.`
        : `Halo ${p.nama}, pesanan Code Caffeine ${p.kode} sudah kami terima: ${p.pesanan}. Total ${rupiah(p.total)}, ${terima}, ${p.untuk_hari}${p.jam ? ' jam ' + p.jam : ''}.${bayar} Terima kasih!`;
    } else if (p.status === 'lunas') t = `Halo ${p.nama}, pembayaran paket Caffeine Challenge ${p.kode} sudah kami terima. Tantanganmu sudah terbuka di web Code Caffeine, buka lagi halamannya lalu tekan TANTANGAN. Selamat main!`;
    else if (p.status === 'selesai') t = `Halo ${p.nama}, ini admin Code Caffeine. Pesanan ${p.kode}: ${p.hadiah}. Diantar ${p.untuk}, ${p.jam}.`;
    else t = `Halo ${p.nama}, ini admin Code Caffeine soal pesanan ${p.kode} (${rupiah(nominal(p))}).`;
    return `https://wa.me/${waIntl(p.wa)}?text=${encodeURIComponent(t)}`;
  }

  /* ---------- tampilan ---------- */
  function detailHTML(p) {
    const k = keyOf(p), A = actsOf(p);
    const rows = [
      ['Kode', p.kode],
      ['WhatsApp', p.wa],
      isWeb(p) ? ['Pesanan', p.pesanan] : ['Paket', `${p.menuNama} Medium`],
      !isWeb(p) && p.hadiah ? ['Hadiah', `${p.hadiah}${p.skor != null ? ` (skor ${Number(p.skor).toLocaleString('id-ID')})` : ''}`] : null,
      ['Terima', p.cara_terima === 'Diantar' ? 'Diantar ke ' + p.lokasi : p.lokasi],
      ['Jam', `${p.jam || '-'} · ${hari(p)}`],
      ['Bayar', isWeb(p) ? `${rupiah(p.total)} ${p.bayar || ''} · ${p.lunas ? 'lunas' + (p.lunas_oleh ? ' (' + p.lunas_oleh + ')' : '') : 'belum lunas'}`
        : `${rupiah(p.harga)} ke ${p.bayar_ke ? p.bayar_ke.jenis : 'DANA'}${['lunas', 'main', 'selesai'].includes(p.status) ? ' · lunas' + (p.lunas_oleh ? ' (' + p.lunas_oleh + ')' : '') : ''}`],
      isWeb(p) && p.stamp_gratis ? ['Stamp', `Tukar kartu: ${p.stamp_gratis} gratis. Cek kartunya.`] : null,
      isWeb(p) && p.pakai_voucher ? ['Voucher', 'Pakai voucher Rp1.000. Cek nomornya.'] : null,
      p.catatan ? ['Catatan', p.catatan] : null,
      p.curiga ? ['Perlu dicek', p.curiga] : null,
      p.tidak_selesai ? ['Game', 'Tidak diselesaikan, skor 0'] : null,
      st(p) === 'batal' && p.alasan_batal ? ['Alasan batal', p.alasan_batal] : null,
      p.diantar ? ['Diantar', `${p.diantar_oleh || ''} ${waktu(p.diantar_at)}`.trim()] : null
    ].filter(Boolean);
    const conf = open.key === k && A[open.aksi] && A[open.aksi].tanya ? A[open.aksi] : null;
    const isBusy = busy.has(k), hint = petunjuk(p);
    const tombol = conf ? '' : `<div class="acts">${actionsFor(p).map(a => `<button class="btn ${A[a].cls}" type="button" data-act="${a}" data-key="${esc(k)}"${isBusy ? ' disabled' : ''}>${A[a].label}</button>`).join('')}<a class="btn ghost" href="${waBuyer(p)}" target="_blank" rel="noopener">WA pembeli</a></div>`;
    const konfirmasi = conf ? `<div class="conf"><p>${esc(conf.tanya(p))}</p>${conf.alasan ? '<input type="text" maxlength="120" placeholder="Alasan (opsional)" aria-label="Alasan pembatalan" data-alasan>' : ''}<div class="acts"><button class="btn ${open.aksi === 'batal' ? 'warn' : ''}" type="button" data-yes="${open.aksi}" data-key="${esc(k)}"${isBusy ? ' disabled' : ''}>${isBusy ? 'Menyimpan…' : conf.ya}</button><button class="btn ghost" type="button" data-no>Tidak jadi</button></div></div>` : '';
    const riw = (p.riwayat || []).map(r => `<p>${esc(waktu(r.t))} · ${esc(r.ev)}${r.oleh ? ' · ' + esc(r.oleh) : ''}</p>`).join('');
    const cek = !isWeb(p) && p.rekaman != null && p.status === 'selesai' && !p.tidak_selesai ? `<p><a href="/main/#cek=${esc(p.rekaman)}" target="_blank" rel="noopener">Putar ulang hitungan skor</a></p>` : '';
    return `<dl>${rows.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl>
      ${hint ? `<p class="hint">${esc(hint)}</p>` : ''}${tombol}${konfirmasi}
      <div class="riw">${riw}${cek}</div>`;
  }
  function rowHTML(p) {
    const k = keyOf(p), buka = expanded.has(k);
    const isi = isWeb(p) ? p.pesanan : `${p.menuNama} Medium${p.hadiah && p.tier === 'large' ? ' → Large' : ''}`;
    return `<article class="ord${buka ? ' buka' : ''}${p._baru ? ' baru' : ''}" data-ord="${esc(k)}">
      <button class="ring" type="button" data-toggle="${esc(k)}" aria-expanded="${buka}">
        <span class="nm">${esc(p.nama)}</span><span class="tot num">${esc(rupiah(nominal(p)))}</span>
        <span class="isi">${esc(isi)}</span><span class="chev" aria-hidden="true">▾</span>
        <span class="chips">${chips(p)}</span>
      </button>
      <div class="det"${buka ? '' : ' hidden'}>${buka ? detailHTML(p) : ''}</div>
    </article>`;
  }
  function rekap(items) {
    const n = new Map(), add = (k, q) => n.set(k, (n.get(k) || 0) + q);
    for (const p of items) {
      if (!isWeb(p)) { add(`${p.menuNama} ${p.tier === 'large' ? 'Large' : 'Medium'}`, 1); continue; }
      if (p.items && p.items.length) p.items.forEach(i => add(`${i.nama} ${{ S: 'Small', M: 'Medium', L: 'Large' }[i.ukuran]}`, i.qty));
      else String(p.pesanan || '').split(';').forEach(x => { const m = x.trim().match(/^(\d+)x (.+)$/); if (m) add(m[2], Number(m[1])); });
    }
    const tot = [...n.values()].reduce((a, b) => a + b, 0);
    return tot ? `Perlu dibuat ${tot} cup: ` + [...n.entries()].sort((a, b) => b[1] - a[1]).map(([k, q]) => `${q}x ${k}`).join(', ') : '';
  }

  function filtered() {
    const q = $('[data-q]').value.trim().toLowerCase(), h = $('[data-hari]').value, digits = q.replace(/\D/g, '');
    return all.filter(p => (!h || hari(p) === h) && (!q || String(p.nama).toLowerCase().includes(q) || String(p.kode).toLowerCase().includes(q) || (digits.length >= 3 && String(p.wa).includes(digits))));
  }
  function renderHari() {
    const sel = $('[data-hari]'), cur = sel.value, days = [...new Set(all.map(hari))];
    sel.innerHTML = '<option value="">Semua hari</option>' + days.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('');
    if (days.includes(cur)) sel.value = cur;
    sel.hidden = days.length < 2;
  }

  function render() {
    const typing = document.activeElement && document.activeElement.matches('[data-alasan]');
    const alasan = typing ? document.activeElement.value : '';
    const list = filtered();
    const by = id => list.filter(p => kelompok(p) === id);
    ['baru', 'proses', 'selesai'].forEach(id => { $(`[data-n="${id}"]`).textContent = by(id).length; });
    $('[data-omzet]').textContent = rupiah(list.filter(sudahBayar).reduce((s, p) => s + nominal(p), 0));
    $('[data-list]').innerHTML = GRUP.map(g => {
      let items = by(g.id);
      if (g.id === 'batal') {
        if (!items.length) return '';
        if (!showBatal) return `<button class="lihat-batal" type="button" data-lihat-batal>Lihat pesanan batal (${items.length})</button>`;
      }
      items = items.slice().sort((a, b) => g.urut === 'lama'
        ? Date.parse(a.sudah_bayar_at || a.dibuat) - Date.parse(b.sudah_bayar_at || b.dibuat)
        : Date.parse(b.diantar_at || b.dibuat) - Date.parse(a.diantar_at || a.dibuat));
      const r = g.id === 'proses' && items.length ? rekap(items) : '';
      return `<section class="grp ${g.id}" id="g-${g.id}">
        <div class="grp-h"><h2>${g.title} <span class="n num">${items.length}</span></h2>${g.salin && items.length ? '<button class="btn ghost" type="button" data-copy>Salin daftar antar</button>' : ''}${g.id === 'batal' ? '<button class="btn ghost" type="button" data-lihat-batal>Sembunyikan</button>' : ''}</div>
        ${r ? `<p class="rekap">${esc(r)}</p>` : ''}
        ${items.length ? items.map(rowHTML).join('') : `<p class="kosong">${{ baru: 'Tidak ada pesanan yang menunggu.', proses: 'Belum ada pesanan yang diproses.', selesai: 'Belum ada pesanan yang selesai.' }[g.id]}</p>`}
      </section>`;
    }).join('');
    const n = all.filter(perluTindak).length;
    document.title = (n ? `(${n}) ` : '') + 'CC Admin · Code Caffeine';
    if (typing) { const inp = $('[data-alasan]'); if (inp) { inp.value = alasan; inp.focus(); } }
  }
  function renderUpd() {
    $('[data-upd]').textContent = lastOk ? `Diperbarui ${jamSaja.format(new Date(lastOk))} WIB` : '';
  }

  let toastT = 0;
  function toast(msg) { const t = $('[data-toast]'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }

  /* ---------- muat data ---------- */
  let loading = null;
  function load(manual) {
    if (!key) { showGate(); return Promise.resolve(); }
    if (loading) return loading;
    loading = (async () => {
      try {
        const d = await api('pesanan');
        admin = d.admin; vapid = d.vapid || ''; pembayaran = d.pembayaran || [];
        const list = [...(d.web || []).map(p => ({ ...p, jenis: 'web' })), ...d.pesanan.map(p => ({ ...p, jenis: 'challenge', id: p.kode }))];
        const tindak = list.filter(perluTindak).map(keyOf);
        const baru = firstLoad ? [] : tindak.filter(k => !seenTindak.has(k));
        seenTindak = new Set(tindak);
        lastOk = Date.now(); renderUpd();
        if (app.hidden) {
          gate.hidden = true; app.hidden = false;
          $('[data-who]').textContent = admin;
          addManifest(); setupNotif();
        }
        // Gambar ulang hanya kalau datanya berubah, supaya baris yang dibuka tidak menutup sendiri
        const s = JSON.stringify(list);
        if (s !== sig || baru.length) {
          sig = s;
          all = list.map(p => ({ ...p, _baru: baru.includes(keyOf(p)) }));
          renderHari(); render();
          all.forEach(p => { p._baru = false; });
        }
        if (baru.length) { toast(baru.length > 1 ? `${baru.length} pesanan baru masuk` : 'Ada pesanan baru masuk'); if (navigator.vibrate) navigator.vibrate(180); }
        firstLoad = false;
      } catch (err) {
        if (err.status === 401) {
          try { localStorage.removeItem(K_KEY); } catch (e) { /* abaikan */ }
          key = ''; showGate(manual ? 'Link admin ini tidak valid atau sudah diganti. Minta link baru ke Dede.' : '');
          if (!manual) $('[data-gate-text]').textContent = 'Link admin ini tidak valid atau sudah diganti. Buka link admin pribadimu yang terbaru.';
        } else {
          $('[data-upd]').textContent = `${err.message} Data terakhir ${lastOk ? jamSaja.format(new Date(lastOk)) + ' WIB' : 'belum ada'}.`;
          if (manual) toast(err.message);
        }
      } finally { loading = null; }
    })();
    return loading;
  }
  $('[data-refresh]').addEventListener('click', async e => {
    const b = e.currentTarget; b.disabled = true; b.textContent = 'Memuat…';
    await load(true);
    b.disabled = false; b.textContent = 'Perbarui';
  });

  /* ---------- ketukan di daftar ---------- */
  const byKey = k => all.find(p => keyOf(p) === k);
  function toggle(k) {
    const art = document.querySelector(`[data-ord="${CSS.escape(k)}"]`), p = byKey(k);
    if (!art || !p) return;
    const buka = !expanded.has(k);
    buka ? expanded.add(k) : expanded.delete(k);
    if (!buka && open.key === k) { open.key = ''; open.aksi = ''; }
    art.classList.toggle('buka', buka);
    $('.ring', art).setAttribute('aria-expanded', String(buka));
    const det = $('.det', art);
    det.innerHTML = buka ? detailHTML(p) : '';
    det.hidden = !buka;
  }
  function redrawRow(k) {
    const art = document.querySelector(`[data-ord="${CSS.escape(k)}"]`), p = byKey(k);
    if (!art || !p) return render();
    if (expanded.has(k)) { $('.det', art).innerHTML = detailHTML(p); }
  }
  $('[data-list]').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.toggle) return toggle(b.dataset.toggle);
    if (b.matches('[data-copy]')) return copyAntar();
    if (b.matches('[data-lihat-batal]')) { showBatal = !showBatal; return render(); }
    if (b.matches('[data-no]')) { const k = open.key; open.key = ''; open.aksi = ''; return redrawRow(k); }
    const k = b.dataset.key, p = byKey(k);
    if (!p) return;
    if (b.dataset.act) {
      const a = actsOf(p)[b.dataset.act];
      if (a.tanya) { open.key = k; open.aksi = b.dataset.act; redrawRow(k); const y = document.querySelector(`[data-yes][data-key="${CSS.escape(k)}"]`); if (y) y.focus(); return; }
      return run(p, b.dataset.act);
    }
    if (b.dataset.yes) {
      const inp = document.querySelector(`[data-ord="${CSS.escape(k)}"] [data-alasan]`);
      return run(p, b.dataset.yes, inp ? inp.value.trim() : '');
    }
  });

  async function run(p, aksi, alasan) {
    const k = keyOf(p);
    if (busy.has(k)) return;
    busy.add(k); redrawRow(k);
    try {
      const r = await api('aksi', isWeb(p) ? { jenis: 'web', id: p.id, aksi, alasan } : { kode: p.kode, aksi, alasan });
      const next = isWeb(p) ? { ...r, jenis: 'web' } : { ...r, jenis: 'challenge', id: r.kode };
      all = all.map(o => keyOf(o) === k ? next : o);
      seenTindak = new Set(all.filter(perluTindak).map(keyOf));
      open.key = ''; open.aksi = '';
      busy.delete(k);
      render();
      toast(`${p.nama}: ${actsOf(p)[aksi].ok}`);
      load();
    } catch (err) {
      busy.delete(k); open.key = ''; open.aksi = '';
      toast(err.message); redrawRow(k); load(true);
    }
  }

  async function copyAntar() {
    const items = filtered().filter(p => kelompok(p) === 'proses');
    const text = [`Daftar antar Code Caffeine · ${[...new Set(items.map(hari))].join(', ')}`, rekap(items), '', ...items.map((p, i) =>
      `${i + 1}. ${p.nama} (${p.wa}) · ${isWeb(p) ? p.pesanan : p.menuNama + ' ' + (p.tier === 'large' ? 'Large' : 'Medium') + ' (Challenge)'} · ${p.cara_terima === 'Diantar' ? 'Antar ke ' + p.lokasi : p.lokasi} · ${p.jam} · ${sudahBayar(p) ? 'lunas' : 'tagih ' + rupiah(nominal(p)) + ' ' + (p.bayar || '')} · ${p.kode}`)].join('\n');
    try { await navigator.clipboard.writeText(text); toast('Daftar antar tersalin'); }
    catch (err) { toast('Tidak bisa menyalin otomatis di browser ini'); }
  }
  $('[data-q]').addEventListener('input', render);
  $('[data-hari]').addEventListener('change', render);

  /* ---------- pasang di layar utama + notifikasi ---------- */
  function addManifest() {
    if ($('link[rel="manifest"]')) return;
    const l = document.createElement('link');
    l.rel = 'manifest'; l.href = '/api/admin/manifest?k=' + encodeURIComponent(key);
    document.head.appendChild(l);
  }
  const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const pushOK = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  let reg = null;
  // Notifikasi belum aktif = panel di atas. Sudah aktif = satu baris kecil di bawah.
  function notifUI(text, tombol, aktif) {
    $('[data-notif]').hidden = aktif || !text;
    $('[data-notif-text]').innerHTML = text || '';
    $('[data-notif-on]').hidden = !tombol;
    $('[data-notif-foot]').hidden = !aktif;
  }
  function b64(s) {
    const pad = '='.repeat((4 - s.length % 4) % 4), raw = atob((s + pad).replace(/-/g, '+').replace(/_/g, '/'));
    return Uint8Array.from(raw, c => c.charCodeAt(0));
  }
  async function setupNotif() {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'refresh') load(true); });
      try { reg = await navigator.serviceWorker.register('/admin/sw.js', { scope: '/admin/' }); } catch (e) { reg = null; }
    }
    if (!pushOK) {
      if (isIOS && !standalone) notifUI('<b>Notifikasi di iPhone</b> hanya jalan dari ikon di Layar Utama.<ol><li>Tekan tombol Bagikan di Safari</li><li>Pilih "Tambah ke Layar Utama"</li><li>Buka CC Admin dari ikon itu, lalu aktifkan notifikasi</li></ol>', false, false);
      else notifUI('Browser ini belum mendukung notifikasi. Pakai Chrome terbaru di Android atau laptop.', false, false);
      return;
    }
    if (!vapid || !reg) { notifUI('', false, false); return; }
    if (Notification.permission === 'denied') { notifUI('Notifikasi diblokir untuk situs ini. Izinkan lewat pengaturan situs di browser, lalu buka lagi.', false, false); return; }
    const sub = await reg.pushManager.getSubscription();
    if (sub && Notification.permission === 'granted') {
      api('langganan', { subscription: sub.toJSON() }).catch(() => {});
      notifUI('', false, true);
    } else notifUI('<b>Nyalakan notifikasi</b> supaya kamu dikabari setiap ada pesanan baru.', true, false);
  }
  $('[data-notif-on]').addEventListener('click', async e => {
    const b = e.currentTarget; b.disabled = true;
    try {
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') { notifUI('Izin notifikasi tidak diberikan. Kamu bisa mencoba lagi lewat pengaturan situs di browser.', false, false); return; }
      reg = reg || await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(vapid) });
      await api('langganan', { subscription: sub.toJSON() });
      notifUI('', false, true); toast('Notifikasi aktif. Coba tekan Tes notifikasi di bawah.');
    } catch (err) {
      notifUI('Gagal mengaktifkan notifikasi: ' + esc(err.message || 'coba lagi') + '.', true, false);
    } finally { b.disabled = false; }
  });
  $('[data-notif-test]').addEventListener('click', async e => {
    const b = e.currentTarget; b.disabled = true;
    try { const r = await api('tes-notif', {}); toast(r.sent ? `Notifikasi terkirim ke ${r.sent} HP admin` : (r.error || 'Belum ada HP yang menerima notifikasi')); }
    catch (err) { toast(err.message); }
    finally { b.disabled = false; }
  });

  let installEv = null;
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEv = e; $('[data-install]').hidden = standalone; });
  $('[data-install-btn]').addEventListener('click', async () => {
    if (!installEv) return;
    installEv.prompt();
    const r = await installEv.userChoice.catch(() => ({}));
    installEv = null;
    if (r.outcome === 'accepted') $('[data-install]').hidden = true;
  });
  addEventListener('appinstalled', () => { $('[data-install]').hidden = true; toast('CC Admin terpasang. Buka dari layar utama HP-mu.'); });

  /* ---------- selalu segar ---------- */
  // Tiap 8 detik saat halaman terlihat. Saat aplikasi dibuka lagi (dari notifikasi, pindah aplikasi, layar
  // menyala) langsung dimuat ulang. Di iPhone, timer berhenti saat aplikasi di latar belakang, jadi jeda
  // panjang antar-detak juga dianggap "baru dibuka lagi".
  function startTimer() { clearInterval(timer); timer = setInterval(() => { if (!document.hidden && key) load(); }, 8000); }
  const segarkan = () => { if (!document.hidden && key) load(true); };
  document.addEventListener('visibilitychange', segarkan);
  addEventListener('focus', segarkan);
  addEventListener('pageshow', segarkan);
  addEventListener('online', segarkan);
  let detak = Date.now();
  setInterval(() => { const n = Date.now(); if (n - detak > 5000) segarkan(); detak = n; }, 1000);
  setInterval(() => { if (lastOk) renderUpd(); }, 30000);
  if (key) { load(true); startTimer(); } else showGate();
})();
</script>
</body>
</html>
