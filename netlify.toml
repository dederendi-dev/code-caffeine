# Situs statis: tidak ada perintah build, langsung terbit dari folder ini.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Font dan gambar jarang berubah, boleh disimpan lama di HP pembeli
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# QR "Caffeine Challenge" di poster mengarah ke /main.
# Selama game belum jadi, arahkan sementara ke bagian "Sedang disiapkan".
# Hapus aturan ini setelah halaman /main (game) dibuat.
[[redirects]]
  from = "/main"
  to = "/#tentang"
  status = 302
  force = false
